# Patch prediction model LoRA fine-tuning configuration
base_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
task: patch
train_data_path: data/train.jsonl
val_data_path: data/val.jsonl
output_dir: outputs/models/patch_lora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

learning_rate: 0.0002
epochs: 3
batch_size: 2
grad_accum: 4
max_length: 512
max_samples: 100  # calibrated for fast local convergence on available CPU/VRAM
