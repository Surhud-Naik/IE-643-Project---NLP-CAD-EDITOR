[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadpatch"
version = "0.1.0"
description = "Learning to Edit Parametric CAD Programs from Natural-Language Instructions"
authors = [{ name = "AIADMK Team (T Ganesh, Surhud Naik)" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4.0",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "pytest>=8.0.0",
    "rapidfuzz>=3.6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "gradio>=4.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
